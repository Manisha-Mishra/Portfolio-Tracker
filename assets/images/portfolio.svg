<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (sun/halo) -->
  <defs>
    <linearGradient id="haloGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A3C"/>
      <stop offset="50%" stop-color="#FFC94A"/>
      <stop offset="100%" stop-color="#FFE88A"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00E0FF"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#4D9DFF"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B35A"/>
      <stop offset="100%" stop-color="#4DFF8A"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="64" fill="#050B1A"/>

  <!-- Halo -->
  <circle cx="256" cy="190" r="130" fill="url(#haloGrad)" opacity="0.9"/>

  <!-- Bars -->
  <g transform="translate(0, 30)">
    <rect x="150" y="240" width="50" height="90" rx="8" fill="url(#barGrad1)"/>
    <rect x="230" y="210" width="50" height="120" rx="8" fill="url(#barGrad2)"/>
    <rect x="310" y="170" width="50" height="160" rx="8" fill="url(#barGrad3)"/>
  </g>

  <!-- Upward arrow -->
  <path d="
    M 140 310
    C 190 260, 230 240, 280 220
    S 360 190, 380 160
  " fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="380,160 365,165 372,145" fill="#FFFFFF"/>

  <!-- Text -->
  <text x="50%" y="390" text-anchor="middle" fill="#FFFFFF"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="600">
    Portfolio
  </text>
  <text x="50%" y="430" text-anchor="middle" fill="#3DFF7A"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30" font-weight="600">
    Tracker
  </text>
</svg>
